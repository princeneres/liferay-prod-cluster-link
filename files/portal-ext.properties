cluster.link.enabled=true
cluster.link.autodetect.address=

# Secrets and the stack path come from the environment (see docker-compose.yml).
cluster.link.auth.cert.alias=liferay-cluster-cert
cluster.link.auth.cipher.type=RSA
cluster.link.auth.keystore.path=/opt/liferay/secrets/cluster_link_keystore.p12
cluster.link.auth.keystore.type=PKCS12

web.server.display.node=true
